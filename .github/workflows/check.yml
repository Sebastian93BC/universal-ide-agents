name: check

on:
  pull_request:
  push:
    branches: [development, quality, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificador único (incluye el escáner de datos sensibles)
        run: make check
